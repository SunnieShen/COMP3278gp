<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMP3278gp · CRUD 分屏演示台</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#e3e6ea; --border2:#cfd4da;
    --text:#1f2933; --muted:#6b7280; --hint:#9aa1ab;
    --blue:#185fa5; --blue-bg:#e6f1fb;
    --green:#0f6e56; --green-bg:#e1f5ee;
    --amber:#854f0b; --amber-bg:#faeeda;
    --red:#a32d2d; --red-bg:#fcebeb;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px; line-height:1.5; height:100vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:10px 16px; display:flex; align-items:center; gap:14px; flex-shrink:0;
  }
  header h1{font-size:15px; font-weight:600; margin:0}
  header .sub{color:var(--muted); font-size:12px}
  .badge{font-size:11px; padding:2px 8px; border-radius:10px; background:var(--blue-bg); color:var(--blue); font-weight:600}

  .timeline{
    background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; padding:8px 16px 0; gap:4px; flex-shrink:0;
  }
  .step{
    flex:1; text-align:center; padding:6px 4px 8px; cursor:pointer;
    border-bottom:2px solid transparent; color:var(--muted); transition:.15s;
  }
  .step:hover{background:var(--bg)}
  .step.active{border-bottom-color:var(--blue); color:var(--text)}
  .step .t{font-family:var(--mono); font-size:11px; color:var(--hint)}
  .step .l{font-size:12px; font-weight:500; margin-top:2px}
  .step .c{font-size:10px; margin-top:2px; font-weight:600}
  .c-C{color:var(--green)} .c-R{color:var(--blue)} .c-U{color:var(--amber)} .c-D{color:var(--red)}

  main{
    flex:1; min-height:0; display:grid;
    grid-template-columns:1.02fr .95fr 1.15fr; gap:10px; padding:10px;
  }
  .col{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .col-h{
    padding:9px 12px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
  }
  .col-h .title{font-weight:600; font-size:13px}
  .col-h .tag{font-size:11px; color:var(--muted)}
  .col-b{flex:1; min-height:0; overflow:auto; padding:12px}

  .urlbar{
    background:var(--bg); border:1px solid var(--border); border-radius:6px;
    padding:5px 10px; font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:10px;
  }
  .shop{
    display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--border);
  }
  .shop .logo{
    width:34px; height:34px; border-radius:8px; background:var(--blue-bg); color:var(--blue);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0;
  }
  .shop .nm{font-weight:600} .shop .meta{color:var(--muted); font-size:11px}
  .statusline{display:flex; align-items:center; gap:8px; margin:10px 0}
  .pill{font-size:11px; padding:2px 9px; border-radius:10px; font-weight:600}
  .pill.Pending{background:var(--amber-bg); color:var(--amber)}
  .pill.Confirmed{background:var(--green-bg); color:var(--green)}
  .pill.EMPTY{background:var(--bg); color:var(--muted)}
  .hintbox{
    background:var(--blue-bg); border-left:3px solid var(--blue);
    padding:8px 10px; border-radius:0 6px 6px 0; margin-bottom:10px; font-size:12px;
  }
  .sect{font-weight:600; font-size:12px; margin:12px 0 6px; color:var(--muted)}
  .member{display:flex; align-items:center; gap:8px; padding:4px 0}
  .av{width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--border2);
      display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted)}
  .av.host{background:var(--blue-bg); color:var(--blue); border-color:var(--blue)}
  .row{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border)}
  .row .n{color:var(--text)} .row .q{font-family:var(--mono); color:var(--muted)}
  .row.removed .n, .row.removed .q{text-decoration:line-through; color:var(--red)}
  .total{margin-top:10px; padding-top:8px; border-top:2px solid var(--border); display:flex; justify-content:space-between; font-weight:600}

  .sqlbox{background:#fbfcfd; border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px}
  .sqlbox .cap{font-size:11px; color:var(--muted); margin-bottom:6px; font-weight:600}
  pre{margin:0; font-family:var(--mono); font-size:11.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word}
  .cm{color:var(--hint)} .kw{color:var(--blue); font-weight:600} .tb{color:var(--green)} .st{color:var(--amber)}
  .narr{
    background:var(--amber-bg); border-left:3px solid var(--amber);
    padding:9px 11px; border-radius:0 6px 6px 0; font-size:12px; line-height:1.65;
  }
  .narr .cap{font-weight:600; color:var(--amber); margin-bottom:3px; font-size:11px}

  .dbtable{margin-bottom:12px}
  .dbtable .tn{
    font-family:var(--mono); font-size:11px; font-weight:600; color:var(--text);
    background:var(--bg); padding:4px 8px; border-radius:5px; margin-bottom:4px; display:inline-block;
  }
  table{border-collapse:collapse; width:100%; font-family:var(--mono); font-size:11px}
  th{text-align:left; color:var(--muted); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--border2); white-space:nowrap}
  td{padding:4px 6px; border-bottom:1px solid var(--border); white-space:nowrap}
  tr.add td{background:var(--green-bg); animation:fa .8s ease-out}
  tr.edit td{background:var(--amber-bg); animation:fa .8s ease-out}
  tr.del td{background:var(--red-bg); color:var(--red); text-decoration:line-through; animation:fa .8s ease-out}
  .empty td{color:var(--hint); font-style:italic}
  @keyframes fa{from{filter:brightness(.9)}to{filter:brightness(1)}}

  footer{
    background:var(--panel); border-top:1px solid var(--border);
    padding:8px 16px; display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  button{
    border:1px solid var(--border2); background:var(--panel); color:var(--text);
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; font-family:inherit;
  }
  button:hover{background:var(--bg)} button.primary{background:var(--blue); color:#fff; border-color:var(--blue)}
  button.primary:hover{filter:brightness(1.08)}
  footer .sp{flex:1}
  footer .note{color:var(--hint); font-size:11px}
  select{border:1px solid var(--border2); border-radius:6px; padding:5px 8px; font-family:inherit; font-size:12px; background:var(--panel)}
</style>
</head>
<body>

<header>
  <h1>CRUD 分屏演示台</h1>
  <span class="badge">COMP3278gp · foodpanda 拼单</span>
  <span class="sub">A = Create　R = Read　U = Update　D = Delete　·　数据与 seed.sql 一致</span>
</header>

<div class="timeline" id="timeline"></div>

<main>
  <section class="col">
    <div class="col-h"><span class="title">① 网页操作</span><span class="tag">浏览器视角</span></div>
    <div class="col-b" id="web"></div>
  </section>
  <section class="col">
    <div class="col-h"><span class="title">② 后端 SQL</span><span class="tag" id="sqlTag">—</span></div>
    <div class="col-b" id="sql"></div>
  </section>
  <section class="col">
    <div class="col-h"><span class="title">③ 数据库表</span><span class="tag">group_eats · 受影响行高亮</span></div>
    <div class="col-b" id="db"></div>
  </section>
</main>

<footer>
  <button id="btnReset">重置</button>
  <button id="btnPrev">上一步</button>
  <button id="btnPlay" class="primary">自动播放</button>
  <button id="btnNext">下一步</button>
  <select id="speed">
    <option value="1">1×</option>
    <option value="0.6">慢速</option>
    <option value="1.8">快速</option>
  </select>
  <span class="sp"></span>
  <span class="note">自包含的排练/讲解工具，用 seed 数据模拟；正式视频需连接真实后端与 MySQL。</span>
</footer>

<script>
const userNames={90001:'Alice Wong',90002:'Bob Chan',90101:'Harbour Cafe'};
const itemNames={92001:'Soy Sauce Chicken Rice',92002:'Hong Kong Milk Tea',92008:'Classic Egg Tart'};
const INITIAL={orders:[],groups:[],participants:[],items:[],_trash:{items:[]}};

const STEPS=[
  {
    t:'0:00', label:'开场 · 浏览菜单', crud:'R',
    hint:'Alice 已登录，正在浏览 Harbour Cafe 的菜单。',
    sql:`<span class="cm">-- 读取店铺菜单（Read）</span>\n<span class="kw">SELECT</span> item_id, item_name, price\n<span class="kw">FROM</span> <span class="tb">menu_items</span>\n<span class="kw">WHERE</span> seller_user_id = <span class="st">90101</span>\n<span class="kw">ORDER BY</span> item_id;`,
    narr:'这是我们的拼单外卖平台。Alice 已登录，正在浏览 Harbour Cafe 的菜单——这一步是 Read，从 menu_items 表读取数据。',
    apply(){}
  },
  {
    t:'0:10', label:'新增拼单与菜品', crud:'C',
    hint:'Alice 创建配送拼单，并加入一份鸡油饭。三张表同时出现新行。',
    sql:`<span class="cm">-- 创建拼单：一个事务写三张表（Create）</span>\n<span class="kw">INSERT INTO</span> <span class="tb">orders</span>\n  (host_user_id, seller_user_id, order_status, fulfillment_type)\n<span class="kw">VALUES</span> (<span class="st">90001</span>, <span class="st">90101</span>, <span class="st">'Pending'</span>, <span class="st">'Delivery'</span>);\n\n<span class="kw">INSERT INTO</span> <span class="tb">group_orders</span> (order_id, deadline)\n<span class="kw">VALUES</span> (<span class="st">94200</span>, <span class="st">'2026-11-17 14:11:00'</span>);\n\n<span class="kw">INSERT INTO</span> <span class="tb">group_order_participants</span>\n  (order_id, buyer_user_id) <span class="kw">VALUES</span> (<span class="st">94200</span>, <span class="st">90001</span>);\n\n<span class="kw">INSERT INTO</span> <span class="tb">order_items</span>\n  (order_id, user_id, item_id, quantity, unit_price_snapshot)\n<span class="kw">VALUES</span> (<span class="st">94200</span>, <span class="st">90001</span>, <span class="st">92001</span>, <span class="st">1</span>, <span class="st">68.00</span>);`,
    narr:'Alice 创建一个配送拼单。后端在一个事务里写入 orders、group_orders 和参与者表，再把鸡油饭写进 order_items。看右边——四张表都出现了绿色的新行。',
    apply(s){
      s.orders.push({order_id:94200,host_user_id:90001,seller_user_id:90101,order_status:'Pending',fulfillment_type:'Delivery',placed_at:'NULL'});
      s.groups.push({order_id:94200,deadline:'14:11:00'});
      s.participants.push({order_id:94200,buyer_user_id:90001});
      s.items.push({order_id:94200,user_id:90001,item_id:92001,quantity:1,unit_price_snapshot:68.00});
    },
    flash:{orders:{key:'94200',type:'add'},groups:{key:'94200',type:'add'},
           participants:{key:'94200_90001',type:'add'},items:{key:'94200_90001_92001',type:'add'}}
  },
  {
    t:'0:35', label:'加入并查看小计', crud:'R',
    hint:'Bob 用邀请链接加入并点一杯奶茶；成员小计用 LEFT JOIN 计算。',
    sql:`<span class="cm">-- Bob 加入（Create）+ 点单</span>\n<span class="kw">INSERT INTO</span> <span class="tb">group_order_participants</span>\n  (order_id, buyer_user_id) <span class="kw">VALUES</span> (<span class="st">94200</span>, <span class="st">90002</span>);\n\n<span class="cm">-- 成员小计（Read）：没有菜的成员显示 0</span>\n<span class="kw">SELECT</span> p.buyer_user_id, u.username,\n       <span class="kw">COALESCE</span>(<span class="kw">SUM</span>(i.quantity * i.unit_price_snapshot), <span class="st">0</span>) <span class="kw">AS</span> subtotal\n<span class="kw">FROM</span> <span class="tb">group_order_participants</span> p\n<span class="kw">JOIN</span> <span class="tb">users</span> u <span class="kw">ON</span> u.user_id = p.buyer_user_id\n<span class="kw">LEFT JOIN</span> <span class="tb">order_items</span> i\n  <span class="kw">ON</span> i.order_id = p.order_id <span class="kw">AND</span> i.user_id = p.buyer_user_id\n<span class="kw">WHERE</span> p.order_id = <span class="st">94200</span>\n<span class="kw">GROUP BY</span> p.buyer_user_id, u.username;`,
    narr:'Bob 通过邀请链接加入，参与者表多了一行，他点了一杯奶茶。中间这条查询是关键的 Read：用 LEFT JOIN 加 COALESCE，没点菜的成员小计也能显示 0。',
    apply(s){
      s.participants.push({order_id:94200,buyer_user_id:90002});
      s.items.push({order_id:94200,user_id:90002,item_id:92002,quantity:1,unit_price_snapshot:22.00});
    },
    flash:{participants:{key:'94200_90002',type:'add'},items:{key:'94200_90002_92002',type:'add'}}
  },
  {
    t:'0:55', label:'修改数量', crud:'U',
    hint:'Bob 把奶茶数量从 1 改成 2，单价快照保持不变。',
    sql:`<span class="cm">-- 修改数量（Update）：只改 quantity，不动快照</span>\n<span class="kw">UPDATE</span> <span class="tb">order_items</span>\n<span class="kw">SET</span> quantity = <span class="st">2</span>\n<span class="kw">WHERE</span> order_id = <span class="st">94200</span>\n  <span class="kw">AND</span> user_id = <span class="st">90002</span>\n  <span class="kw">AND</span> item_id = <span class="st">92002</span>;`,
    narr:'Bob 把奶茶数量从 1 改到 2。注意右边这一行的 quantity 变了，但 unit_price_snapshot 仍然是 22.00——历史价格快照不会因为改数量而改变。',
    apply(s){s.items.find(x=>x.user_id===90002&&x.item_id===92002).quantity=2;},
    flash:{items:{key:'94200_90002_92002',type:'edit'}}
  },
  {
    t:'1:20', label:'移除菜品', crud:'D',
    hint:'Alice 移除自己的鸡油饭；这一行被真正 DELETE。',
    sql:`<span class="cm">-- 删除自己的菜（Delete）</span>\n<span class="kw">DELETE FROM</span> <span class="tb">order_items</span>\n<span class="kw">WHERE</span> order_id = <span class="st">94200</span>\n  <span class="kw">AND</span> user_id = <span class="st">90001</span>\n  <span class="kw">AND</span> item_id = <span class="st">92001</span>;`,
    narr:'Alice 把自己的鸡油饭移除。这是一次真正的 DELETE，右边那一行以红色标出后被删掉；刷新页面也不会再出现。',
    apply(s){
      const i=s.items.findIndex(x=>x.user_id===90001&&x.item_id===92001);
      s._trash.items.push(s.items[i]); s.items.splice(i,1);
    },
    flash:{items:{key:'94200_90001_92001',type:'del'}}
  },
  {
    t:'1:45', label:'提交订单', crud:'U',
    hint:'Alice 提交拼单：Pending → Confirmed，记录 placed_at。',
    sql:`<span class="cm">-- 提交拼单（Update）：状态流转</span>\n<span class="kw">UPDATE</span> <span class="tb">orders</span>\n<span class="kw">SET</span> order_status = <span class="st">'Confirmed'</span>,\n    placed_at = <span class="st">'2026-11-17 14:12:00'</span>\n<span class="kw">WHERE</span> order_id = <span class="st">94200</span>;\n\n<span class="cm">-- 刷新后仍在：数据已持久化</span>\n<span class="kw">SELECT</span> order_status, placed_at\n<span class="kw">FROM</span> <span class="tb">orders</span> <span class="kw">WHERE</span> order_id = <span class="st">94200</span>;`,
    narr:'最后 Alice 提交拼单，订单状态从 Pending 变成 Confirmed，并写上提交时间。状态变成了只读——刷新页面数据依然存在，说明所有改动都已持久化到 MySQL。',
    apply(s){const o=s.orders.find(x=>x.order_id===94200);o.order_status='Confirmed';o.placed_at='14:12:00';},
    flash:{orders:{key:'94200',type:'edit'}}
  }
];

let current=0, timer=null, playing=false;
const $=id=>document.getElementById(id);

function buildState(idx){
  const s=JSON.parse(JSON.stringify(INITIAL));
  for(let i=0;i<=idx;i++) STEPS[i].apply(s);
  return s;
}

function renderTimeline(){
  $('timeline').innerHTML=STEPS.map((st,i)=>
    `<div class="step ${i===current?'active':''}" data-i="${i}">
       <div class="t">${st.t}</div>
       <div class="l">${st.label}</div>
       <div class="c c-${st.crud}">${st.crud==='C'?'Create':st.crud==='R'?'Read':st.crud==='U'?'Update':'—'}</div>
     </div>`).join('');
  $('timeline').querySelectorAll('.step').forEach(el=>el.onclick=()=>{stop();current=+el.dataset.i;render();});
}

function renderWeb(st,s){
  const o=s.orders[0];
  const status=o?o.order_status:'EMPTY';
  const members=s.participants.map(p=>
    `<div class="member"><span class="av ${p.buyer_user_id===90001?'host':''}">${p.buyer_user_id===90001?'A':'B'}</span>
       <span>${userNames[p.buyer_user_id]}${p.buyer_user_id===90001?' · 发起人':''}</span></div>`).join('')||'<span class="sub">尚未创建拼单</span>';
  let lines=s.items.map(x=>
    `<div class="row"><span class="n">${itemNames[x.item_id]} <span style="color:var(--hint)">· ${userNames[x.user_id]}</span></span>
       <span class="q">×${x.quantity} · $${(x.quantity*x.unit_price_snapshot).toFixed(2)}</span></div>`).join('');
  const delKey=st.flash&&st.flash.items&&st.flash.items.type==='del';
  if(delKey && s._trash.items.length){
    const x=s._trash.items[s._trash.items.length-1];
    lines+=`<div class="row removed"><span class="n">${itemNames[x.item_id]} · ${userNames[x.user_id]}</span>
       <span class="q">×${x.quantity} · 已删除</span></div>`;
  }
  const subtotal=s.items.reduce((a,x)=>a+x.quantity*x.unit_price_snapshot,0);
  $('web').innerHTML=`
    <div class="urlbar">127.0.0.1:5000/#/group/94200</div>
    <div class="shop"><div class="logo">HC</div><div>
      <div class="nm">Harbour Cafe</div><div class="meta">中环 · Restaurant · 配送 / 自取</div></div></div>
    <div class="hintbox">${st.hint}</div>
    <div class="statusline"><span>订单 94200</span><span class="pill ${status}">${status==='EMPTY'?'未创建':status}</span>
      ${o&&o.placed_at!=='NULL'?`<span style="color:var(--muted);font-size:11px">提交于 ${o.placed_at}</span>`:''}</div>
    <div class="sect">参与成员</div>${members}
    <div class="sect">已加入菜品</div>${lines||'<span style="color:var(--hint)">暂无</span>'}
    <div class="total"><span>菜品小计</span><span>$${subtotal.toFixed(2)}</span></div>`;
}

function renderSql(st){
  $('sqlTag').textContent=st.crud==='C'?'Create':st.crud==='R'?'Read':st.crud==='U'?'Update':'—';
  $('sql').innerHTML=`
    <div class="sqlbox"><div class="cap">当前步骤执行的 SQL</div><pre>${st.sql}</pre></div>
    <div class="narr"><div class="cap">口播词 · 照着念即可</div>${st.narr}</div>`;
}

function tableHTML(tn,cols,rows,flash,keyfn){
  const head='<tr>'+cols.map(c=>`<th>${c.label}</th>`).join('')+'</tr>';
  const body=rows.length?rows.map(r=>{
    const k=keyfn(r);
    const f=flash&&flash[tn]&&flash[tn].key===k?flash[tn].type:'';
    return `<tr class="${f}">`+cols.map(c=>`<td>${r[c.k]!==undefined?r[c.k]:'—'}</td>`).join('')+'</tr>';
  }).join(''):`<tr class="empty"><td colspan="${cols.length}">（空）</td></tr>`;
  return `<div class="dbtable"><div class="tn">${tn}</div><table>${head}${body}</table></div>`;
}

function renderDb(st,s){
  let h='';
  h+=tableHTML('orders',[
    {k:'order_id',label:'order_id'},{k:'host_user_id',label:'host_user_id'},
    {k:'seller_user_id',label:'seller_user_id'},{k:'order_status',label:'order_status'},
    {k:'placed_at',label:'placed_at'}],s.orders,st.flash,r=>String(r.order_id));

  h+=tableHTML('group_orders',[
    {k:'order_id',label:'order_id'},{k:'deadline',label:'deadline'}],
    s.groups,st.flash,r=>String(r.order_id));

  h+=tableHTML('group_order_participants',[
    {k:'order_id',label:'order_id'},{k:'buyer_user_id',label:'buyer_user_id'}],
    s.participants,st.flash,r=>r.order_id+'_'+r.buyer_user_id);

  const itemCols=[
    {k:'order_id',label:'order_id'},{k:'user_id',label:'user_id'},
    {k:'item_id',label:'item_id'},{k:'quantity',label:'quantity'},
    {k:'unit_price_snapshot',label:'unit_price_snapshot'}];
  const showTrash=st.flash&&st.flash.items&&st.flash.items.type==='del';
  const itemRows=s.items.concat(showTrash?s._trash.items:[]);
  h+=tableHTML('order_items',itemCols,itemRows,st.flash,r=>r.order_id+'_'+r.user_id+'_'+r.item_id);

  $('db').innerHTML=h;
}

function render(){
  const st=STEPS[current];
  const s=buildState(current);
  renderTimeline(); renderWeb(st,s); renderSql(st); renderDb(st,s);
}

function stop(){playing=false;clearInterval(timer);$('btnPlay').textContent='自动播放';}
function next(){if(current<STEPS.length-1){current++;render();}else stop();}

$('btnReset').onclick=()=>{stop();current=0;render();};
$('btnPrev').onclick=()=>{stop();if(current>0){current--;render();}};
$('btnNext').onclick=()=>{stop();next();};
$('btnPlay').onclick=()=>{
  if(playing){stop();return;}
  playing=true; $('btnPlay').textContent='暂停';
  if(current===STEPS.length-1){current=0;render();}
  const tick=()=>{
    const mult=parseFloat($('speed').value);
    timer=setTimeout(()=>{next();if(playing)tick();},2600/mult);
  };
  tick();
};

render();
</script>
</body>
</html>
